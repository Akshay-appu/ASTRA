name: Finalize Astra website

on:
  push:
    branches: [homepage-redesign]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message != 'Finalize website QA and legal pages'
    runs-on: ubuntu-latest
    steps:
      - name: Check out homepage-redesign
        uses: actions/checkout@v6
        with:
          ref: homepage-redesign
          fetch-depth: 0

      - name: Apply source fixes and run QA
        shell: python
        run: |
          from pathlib import Path
          import re
          from html.parser import HTMLParser

          root = Path('.')
          replacements = {
              'â€”': '—', 'â€“': '–', 'â†—': '→', 'â†’': '→', 'â†‘': '↑', 'â†“': '↓',
              'âœ¦': '✨', 'âœ“': '✓', 'âš™ï¸': '⚙️', 'âš¡': '⚡', 'â—': '●',
              'ðŸ–¥ï¸': '🖥️', 'ðŸ“±': '📱', 'ðŸ¤–': '🤖', 'ðŸ“Š': '📊', 'ðŸ“ˆ': '📈',
              'ðŸ“‹': '📋', 'ðŸ“': '📁', 'ðŸ”¥': '🔥', 'ðŸ’¡': '💡', 'ðŸ”§': '🔧',
              'ðŸŽ¯': '🎯', 'ðŸŸ¢': '🟢', 'ðŸŒŸ': '🌟', 'â‚¹': '₹', 'Â©': '©',
              'Â®': '®', 'Â·': '·', 'â€œ': '“', 'â€': '”', 'â€˜': '‘', 'â€™': '’', 'â€¦': '…'
          }

          html_files = sorted(root.glob('*.html'))
          for path in html_files:
              text = path.read_text(encoding='utf-8')
              fixed = text
              for bad, good in replacements.items():
                  fixed = fixed.replace(bad, good)
              fixed = fixed.replace('href="contact.html">Privacy', 'href="privacy.html">Privacy')
              fixed = fixed.replace('href="contact.html">Terms', 'href="terms.html">Terms')
              fixed = fixed.replace('Client testimonial will be added here.', 'We are building this section with verified client stories and measurable project outcomes.')
              fixed = fixed.replace('Client Name', 'Astra Client')
              fixed = fixed.replace('Business / Company', 'Verified client story coming soon')
              fixed = fixed.replace('By Astra Team • Jan 01', 'By Astra Digital Market • Insights')
              if fixed != text:
                  path.write_text(fixed, encoding='utf-8')

          legal_template = '''<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>{title} | Astra Digital Market</title>
            <meta name="description" content="{description}">
            <link rel="canonical" href="https://www.astradigitalmarket.in/{file}">
            <link rel="icon" type="image/png" href="img/astra-logo-new.png">
            <link rel="apple-touch-icon" href="img/astra-logo-new.png">
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
            <link href="css/astra-ui.css" rel="stylesheet">
          </head>
          <body class="ap-page">
            <header class="ap-nav">
              <div class="ap-container ap-nav-inner">
                <a href="index.html" class="ap-logo" aria-label="Astra Digital Market — Home"><img src="img/astra-logo-new.png" alt="Astra Digital Market logo" width="180" height="52"></a>
                <nav class="ap-menu" aria-label="Primary">
                  <a href="index.html">Home</a><a href="about.html">About</a><a href="service.html">Services</a><a href="solutions.html">Solutions</a><a href="pricing.html">Pricing</a><a href="blog.html">Blog</a><a href="contact.html">Contact</a>
                </nav>
                <div class="ap-nav-cta"><a href="contact.html" class="ap-btn ap-btn-gold ap-btn-sm">Start a Project →</a><button class="ap-burger" aria-expanded="false" aria-controls="auMobile" aria-label="Open menu"><span></span><span></span><span></span></button></div>
              </div>
              <nav class="ap-mobile" id="auMobile" aria-label="Mobile"><a href="index.html">Home</a><a href="about.html">About</a><a href="service.html">Services</a><a href="solutions.html">Solutions</a><a href="pricing.html">Pricing</a><a href="blog.html">Blog</a><a href="contact.html">Contact</a><a href="contact.html" class="ap-btn ap-btn-gold">Start a Project →</a></nav>
            </header>
            <main>
              <section class="ap-pagehero"><div class="ap-hero-grid-bg" aria-hidden="true"></div><div class="ap-container"><p class="ap-eyebrow ap-reveal">{eyebrow}</p><h1 class="ap-h1 ap-reveal ap-d1">{title}</h1><p class="ap-lead ap-reveal ap-d2">{intro}</p><nav class="ap-breadcrumb ap-reveal ap-d3" aria-label="Breadcrumb"><a href="index.html">Home</a><span class="sep">/</span><span aria-current="page">{title}</span></nav></div></section>
              <section class="ap-section"><div class="ap-container"><div class="ap-card" style="padding:38px;">{content}</div></div></section>
            </main>
            <footer class="ap-footer"><div class="ap-container"><div class="ap-footer-grid"><div class="ap-footer-brand"><img src="img/astra-logo-new.png" alt="Astra Digital Market logo" loading="lazy" width="180" height="52"><p>Digital marketing, technology and creative solutions for businesses ready to grow.</p></div><nav aria-label="Footer navigation"><h4>EXPLORE</h4><ul><li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li><li><a href="service.html">Services</a></li><li><a href="solutions.html">Solutions</a></li><li><a href="pricing.html">Pricing</a></li><li><a href="blog.html">Blog</a></li><li><a href="contact.html">Contact</a></li></ul></nav><nav aria-label="Footer services"><h4>SERVICES</h4><ul><li><a href="service.html">Digital Marketing</a></li><li><a href="meta-whatsapp.html">Meta &amp; WhatsApp API</a></li><li><a href="service.html">Website Development</a></li><li><a href="service.html">Software Development</a></li><li><a href="service.html">Mobile Apps</a></li><li><a href="service.html">AI Automation</a></li></ul></nav><div><h4>CONTACT</h4><ul class="ap-footer-contact"><li>Bangalore, Karnataka, India</li><li><a href="mailto:brandastraa@gmail.com">brandastraa@gmail.com</a></li><li><a href="tel:+918310704861">+91 83107 04861</a></li><li><a href="https://wa.me/918310704861" target="_blank" rel="noopener">WhatsApp Us</a></li></ul></div></div><div class="ap-footer-bottom"><span>© <span id="auYear">2026</span> Astra Digital Market. All rights reserved.</span><nav aria-label="Legal"><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></nav></div></div></footer>
            <script src="js/astra-ui.js" defer></script>
          </body>
          </html>'''

          privacy = '''<h2 class="ap-h2">Privacy <span class="ap-gold">Policy</span></h2>
          <p>Effective date: September 9, 2026</p>
          <p>Astra Digital Market respects your privacy. This policy explains what information we collect when you contact us or use our website, how we use it, and the choices available to you.</p>
          <h3 class="ap-h3">Information we collect</h3><p>When you submit an enquiry, we may receive your name, company name, email address, phone number, selected services, budget information, and project details.</p>
          <h3 class="ap-h3">How we use information</h3><p>We use enquiry information to respond to requests, prepare proposals, provide services, communicate about projects, and improve our website and services. We do not sell enquiry information.</p>
          <h3 class="ap-h3">Service providers</h3><p>We may use trusted service providers for website hosting, analytics, communications, and enquiry delivery. They receive only the information needed to provide their service.</p>
          <h3 class="ap-h3">Retention and security</h3><p>We retain information only as reasonably necessary for business, legal, or service purposes and use reasonable safeguards to protect it. No internet transmission can be guaranteed completely secure.</p>
          <h3 class="ap-h3">Your choices</h3><p>You may ask us to correct or delete personal information we hold about you, subject to applicable legal requirements.</p>
          <h3 class="ap-h3">Contact</h3><p>For privacy questions, email <a href="mailto:brandastraa@gmail.com">brandastraa@gmail.com</a>.</p>'''
          terms = '''<h2 class="ap-h2">Terms &amp; <span class="ap-gold">Conditions</span></h2>
          <p>Effective date: September 9, 2026</p>
          <p>These terms govern use of the Astra Digital Market website and the general relationship between Astra Digital Market and prospective clients using our enquiry channels.</p>
          <h3 class="ap-h3">Website use</h3><p>You may use this website for lawful business and informational purposes. Do not misuse the website, attempt unauthorized access, or interfere with its operation.</p>
          <h3 class="ap-h3">Services and proposals</h3><p>Service descriptions and starting prices are informational. A project begins only after scope, deliverables, timelines, fees, payment terms, and responsibilities are agreed in writing.</p>
          <h3 class="ap-h3">Client responsibilities</h3><p>Clients are responsible for providing accurate information, approvals, access, content, and third-party account permissions needed for agreed work.</p>
          <h3 class="ap-h3">Intellectual property</h3><p>Ownership and licensing of project deliverables are governed by the applicable project agreement. Third-party software, platforms, fonts, stock assets, and APIs remain subject to their respective licenses.</p>
          <h3 class="ap-h3">Third-party platforms</h3><p>Marketing, messaging, hosting, advertising, payment, and API services are operated by third parties and may change their policies, availability, or pricing. Astra cannot guarantee uninterrupted third-party service availability.</p>
          <h3 class="ap-h3">Limitation</h3><p>To the extent permitted by law, Astra Digital Market is not responsible for indirect losses arising from third-party outages, platform changes, or information supplied inaccurately by a client.</p>
          <h3 class="ap-h3">Contact</h3><p>Questions about these terms can be sent to <a href="mailto:brandastraa@gmail.com">brandastraa@gmail.com</a>.</p>'''

          privacy_html = legal_template.format(title='Privacy Policy', file='privacy.html', description='Privacy Policy for Astra Digital Market.', eyebrow='PRIVACY', intro='How Astra Digital Market handles information shared through this website.', content=privacy)
          terms_html = legal_template.format(title='Terms & Conditions', file='terms.html', description='Terms and Conditions for Astra Digital Market.', eyebrow='LEGAL', intro='The terms that apply to use of the Astra Digital Market website and project enquiries.', content=terms)
          Path('privacy.html').write_text(privacy_html, encoding='utf-8')
          Path('terms.html').write_text(terms_html, encoding='utf-8')

          # Add a lightweight client-side phone sanity check without changing the form provider.
          contact = Path('contact.html')
          text = contact.read_text(encoding='utf-8')
          marker = 'var phone    = "+91" + rawPhone;'
          if marker in text and 'Please enter a valid 10-digit Indian mobile number.' not in text:
              text = text.replace(marker, 'if (!/^\\d{10}$/.test(rawPhone)) { status.style.color = "#ff5252"; status.textContent = "⚠️ Please enter a valid 10-digit Indian mobile number."; return; }\\n        ' + marker)
          contact.write_text(text, encoding='utf-8')

          # Verify all relative HTML links and local anchors.
          errors = []
          for path in sorted(root.glob('*.html')):
              source = path.read_text(encoding='utf-8')
              for href in re.findall(r'''href=["']([^"'#?]+)(?:["'#?])''', source, flags=re.I):
                  if href.startswith(('http://','https://','mailto:','tel:','javascript:','data:')):
                      continue
                  target = (path.parent / href).resolve()
                  if not target.exists():
                      errors.append(f'{path}: missing {href}')
              for href in re.findall(r'''href=["']([^"']*#[^"']*)["']''', source, flags=re.I):
                  file_part, frag = href.split('#',1)
                  target_path = (path.parent / (file_part or path.name)).resolve()
                  if target_path.exists() and frag and frag not in target_path.read_text(encoding='utf-8'):
                      errors.append(f'{path}: missing anchor {href}')

          # Source mojibake scan.
          mojibake_hits = []
          for path in html_files + [Path('privacy.html'), Path('terms.html')]:
              source = path.read_text(encoding='utf-8')
              for bad in replacements:
                  if bad in source:
                      mojibake_hits.append(f'{path}: {bad}')

          # Contact form structural/config test (a live submission still requires a browser/network run).
          contact_source = contact.read_text(encoding='utf-8')
          required_form_tokens = ['id="astraContactForm"','id="astraFormStatus"','emailjs.init','emailjs.send','service_1ve16ms','template_fz0if97','0FjVqIv0m3fzw20fQ']
          form_errors = [token for token in required_form_tokens if token not in contact_source]

          report = ['# Astra Website QA', '', 'Branch: `homepage-redesign`', '', '## Results', '- Source HTML mojibake: ' + ('PASS' if not mojibake_hits else 'FAIL'), '- Internal relative links: ' + ('PASS' if not errors else 'FAIL'), '- Contact form structure/config: ' + ('PASS' if not form_errors else 'FAIL'), '- Legal pages: PASS (`privacy.html`, `terms.html`)', '- Placeholder cleanup: PASS (known placeholder strings removed)', '', '## Contact form live test', 'A real browser submission was not executed by this workflow. The EmailJS configuration and form structure were verified; perform one real submission from the deployed Contact page to confirm delivery end-to-end.']
          if errors:
              report += ['', '### Link errors'] + [f'- {e}' for e in errors]
          if mojibake_hits:
              report += ['', '### Mojibake hits'] + [f'- {e}' for e in mojibake_hits]
          if form_errors:
              report += ['', '### Form configuration errors'] + [f'- Missing: `{e}`' for e in form_errors]
          Path('QA-REPORT.md').write_text('\n'.join(report) + '\n', encoding='utf-8')

          if errors or mojibake_hits or form_errors:
              raise SystemExit('QA failed; see QA-REPORT.md')

      - name: Commit finalized website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' 'QA-REPORT.md'
          git diff --cached --quiet && exit 0
          git commit -m "Finalize website QA and legal pages"
          git push origin homepage-redesign
