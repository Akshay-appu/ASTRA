name: Fix homepage UTF-8

on:
  push:
    branches:
      - homepage-redesign
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homepage-redesign
        uses: actions/checkout@v4
        with:
          ref: homepage-redesign
          fetch-depth: 0

      - name: Repair mojibake in homepage
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "\u00e2\u20ac\u201d": "\u2014",
              "\u00e2\u2020\u2019": "\u2192",
              "\u00e2\u2020\u2014": "\u2192",
              "\u00e2\u0161\u2122\u00ef\u00b8\u008f": "\u2699\ufe0f",
              "\u00f0\u0178\u2013\u00a5\u00ef\u00b8\u008f": "\U0001f5a5\ufe0f",
              "\u00f0\u0178\u201c\u00b1": "\U0001f4f1",
              "\u00f0\u0178\u00a4\u2013": "\U0001f916",
              "\u00f0\u0178\u201c\u0160": "\U0001f4ca",
              "\u00f0\u0178\u201c\u02c6": "\U0001f4c8",
              "\u00e2\u0153\u00a6": "\u2728",
          }

          for bad, good in replacements.items():
              text = text.replace(bad, good)

          path.write_text(text, encoding="utf-8", newline="\n")

      - name: Commit repair if needed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No UTF-8 repair needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix UTF-8 characters on homepage"
          git push origin HEAD:homepage-redesign
