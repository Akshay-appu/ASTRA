name: Astra website QA

on:
  push:
    branches: [homepage-redesign]

permissions:
  contents: write

jobs:
  qa-and-fix:
    if: github.event.head_commit.message != 'Finalize website QA and legal pages'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: homepage-redesign
          fetch-depth: 0

      - name: Apply fixes and verify
        run: python3 tools/finalize_website.py

      - name: Commit finalized website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' 'QA-REPORT.md'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finalize website QA and legal pages"
          git push origin homepage-redesign
